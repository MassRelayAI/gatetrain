# gatetrain red classes: the ONE rule table, read by gatetrain/diagnose.py (Python, tomllib) and by crates/gatetrain-core
# (Rust, include_str!). A new failure class is a new [[rule]] here, never new code. FIRST MATCH WINS, per failure block.
# Keys: id (name), cls (class printed), pattern (regex searched in the block, multiline), absent (optional regex: when it
# matches anywhere in the block the rule does not apply), also (optional regex that must ALSO match in the block),
# when ("slow" = the step's duration is far above its median), shrink (true: groups 1 and 2 of pattern are (expected, got)
# and the rule applies only when got < expected), remedy (text), rerun (true = a rerun after the remedy suffices).
# Regexes must be valid in BOTH Python re and Rust regex: no lookaround, no backreferences. Use ''''...''' literal strings.

[[rule]]
id = "out-of-memory"
cls = "infra-memory"
pattern = '''(?i)(?:\bexit(?:ed)?(?: with)?(?: code| status)? ?137\b|\brc[= ]137\b|^Killed\s*$|\bout of memory\b|\bOOM\b|cannot allocate memory|stopped because the system is running low on memory|signal: 9, SIGKILL)'''
absent = '''AssertionError|^\s*Tests\s.*?(?:^|\D)[1-9]\d* failed'''
remedy = "the host ran out of memory and the step was killed: not a code defect. Lower the parallelism (GATETRAIN_PARALLEL and CARGO_BUILD_JOBS come from `gatetrain hold` with memory in hosts.toml), run the cheap set first, or use a bigger host; then rerun the step (L67)"
rerun = true

[[rule]]
id = "port-collision"
cls = "infra-port"
pattern = '''failed to bind host port|address already in use|EADDRINUSE|port is already allocated'''
remedy = "a gate's port was taken: keep random port ranges below the ephemeral range (for example 20000-31999) or inside ip_local_reserved_ports, and give every gate a unique fixed port; run `gatetrain doctor`"
rerun = true

[[rule]]
id = "windows-artefact"
cls = "platform-windows"
pattern = '''The command line is too long|path separator|expected ['\"][^'\"\n]*/[^'\"\n]*['\"],? (?:got|received) ['\"][^'\"\n]*\\[^'\"\n]*['\"]|expected ['\"][^'\"\n]*\\[^'\"\n]*['\"],? (?:got|received) ['\"][^'\"\n]*/[^'\"\n]*['\"]'''
remedy = "this red only happens on Windows (long command line, backslash vs slash in an allow-list): run that step on Linux for the merge decision"
rerun = true

[[rule]]
id = "generated-not-committed"
cls = "generated-uncommitted"
pattern = '''(?i)\bmissing:|\bstray\b'''
also = '''(?i)on[- ]disk|disk (?:equals|==|vs|matches)|differs from (?:the )?build'''
remedy = "a generator made a NEW file that was never committed (the stack committed tracked changes only): regenerate, `git add` the new file by name, commit on the batch; `gatetrain generated` lists such files before the chain"
rerun = true

[[rule]]
id = "baseline-shrink-count"
cls = "baseline-shrink"
pattern = '''expected length (\d+),? (?:got|received) (\d+)'''
shrink = true
remedy = "a shrink-only list got shorter because a lane fixed something: delete the entry and lower the pinned count in the same commit"
rerun = true

[[rule]]
id = "baseline-shrink-entry"
cls = "baseline-shrink"
pattern = '''(?i)now (?:witnessed|reach(?:es)? (?:the )?gates?)\b.*\bdelete\b|\bdelete (?:the|this) entry\b|\bdelete their\b.*\bentries\b'''
remedy = "a shrink-only list still names something that is now fixed: delete the entry and lower the pinned count in the same commit"
rerun = true

[[rule]]
id = "baseline-missing"
cls = "baseline-missing"
pattern = '''\bNEW\b.*\bnot in\b|nobody classified'''
remedy = "a new route or table is not yet on a list it must join: add it with a reason, in the same commit"
rerun = true

[[rule]]
id = "load-flake"
cls = "flake-load"
pattern = '''(?i)(?:hook|test) timed out in \d+ ?m?s|timed out after \d+ ?m?s'''
absent = '''AssertionError|^\s*Tests\s(?:.*?\D)?[1-9]\d* failed'''
when = "slow"
remedy = "a timeout with no failed test on a slow, loaded step: raise the hook or test timeout for the slow engine, or reduce the step's parallel neighbours. Under a zero-red merge rule it still needs a full green rerun"
rerun = true

# ---- environment classes (audit GT-COVER rows 41, 66, 68, 69, 70, 96, 106): each cost a whole chain and was labelled `real` by hand ----

[[rule]]
id = "build-folder-missing"
cls = "infra-build-folder"
pattern = '''(?i)failed to create (?:the )?(?:target |build )?(?:dir|directory|folder)[^\n]*(?:\n[^\n]*){0,3}?(?:No such file or directory|cannot find the path specified|File exists|Not a directory|dangling)'''
absent = '''AssertionError|^\s*Tests\s(?:.*?\D)?[1-9]\d* failed'''
remedy = "the build folder is a dangling link or missing (a cleaned linked folder was not re-created): every cargo step dies at once. Run `gatetrain doctor` (build folders resolve), re-create the folder the link points to, then rerun the step"
rerun = true

[[rule]]
id = "service-never-came-up"
cls = "infra-service"
pattern = '''(?i)\bconnection refused\b|\bECONNREFUSED\b|could not connect to server|container (?:start|startup)(?: timed? ?out|\s+failed)|did not become (?:ready|healthy)|cannot connect to the docker daemon|is the docker daemon running'''
absent = '''AssertionError|^\s*Tests\s(?:.*?\D)?[1-9]\d* failed'''
remedy = "a service the gate needs never came up (connection refused, daemon race, container start timeout): not a code defect. Check `gatetrain doctor`, wait for the service to be healthy, then rerun the step"
rerun = true

[[rule]]
id = "cache-server-died"
cls = "infra-cache-server"
pattern = '''(?i)sccache: (?:error|caused by)[^\n]*(?:server startup failed|failed to (?:connect|start)|no such file or directory|connection refused)|sccache: caused by[^\n]*(?:server startup failed|failed to (?:connect|start))'''
remedy = "the shared compile-cache server died (it inherited a job's temporary folder and lost it): restart it with its own environment and no idle timeout (L20), then rerun; a burst of compile failures after one job ended is this, not the code"
rerun = true

[[rule]]
id = "packages-not-built"
cls = "setup-packages"
pattern = '''Cannot find module|ERR_MODULE_NOT_FOUND|Failed to resolve (?:entry|import)|error TS2307'''
absent = '''AssertionError|^\s*Tests\s(?:.*?\D)?[1-9]\d* failed'''
remedy = "a fresh checkout without the workspace packages built (or a linked node_modules that is stale): build the packages first, then rerun; this is the order in the repository's preflight, not a defect of the lane"
rerun = true

[[rule]]
id = "windows-linker"
cls = "platform-windows"
pattern = '''(?i)LINK : fatal error LNK\d+|linker `link\.exe` (?:failed|not found)|error: linking with `(?:link|cl)(?:\.exe)?` failed|link\.exe[^\n]*not found'''
remedy = "a linker failure on Windows is the environment, not a test: use the MSVC wrapper shell, or run that step on Linux for the merge decision"
rerun = true

[[rule]]
id = "generated-stale"
cls = "generated-stale"
pattern = '''(?i)\b(?:is|are)\s+(?:out of date|stale)\b[^\n]*\bregenerat|\bstale\b[^\n]*\bregenerat|regenerate (?:it|them|with|using)\b'''
absent = '''AssertionError|^\s*Tests\s(?:.*?\D)?[1-9]\d* failed'''
remedy = "a tracked generated file is stale (a fix moved lines): run the generators, commit the result by name on the batch, and prove again; `gatetrain generated` and the settle step catch this before the chain"
rerun = true

[[rule]]
id = "browser-timeout"
cls = "flake-load"
pattern = '''(?i)Test timeout of \d+ ?m?s exceeded|\bTimeout \d+ ?m?s exceeded|page\.\w+: Timeout|TimeoutError: [^\n]*\d+ ?ms|waiting for (?:selector|locator)[^\n]*timeout'''
absent = '''AssertionError|^\s*Tests\s(?:.*?\D)?[1-9]\d* failed'''
when = "slow"
remedy = "a browser-suite timeout with no failed assertion on a slow, loaded step: raise the suite timeout for the loaded host or reduce the step's parallel neighbours. Under a zero-red merge rule it still needs a full green rerun"
rerun = true
