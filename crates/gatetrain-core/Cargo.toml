[package]
name = "gatetrain-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gatetrain core: ledger, decision log, log parser (no terminal, no argument parsing)"

[dependencies]
serde.workspace = true        # derive Serialize on the loaded Config
serde_json.workspace = true   # canonical JSON, --json output
rusqlite.workspace = true     # the ledger
sha2.workspace = true         # the hash chain
regex.workspace = true        # log markers, port scan, lanes radar
thiserror.workspace = true    # typed errors
chrono.workspace = true       # local time stamps (tidy log, trash names)
toml.workspace = true         # hosts.toml capacity, the shared rule table, gatetrain.toml plugin sections

[target.'cfg(unix)'.dependencies]
libc = "0.2"                  # the plugin watchdog (runner.rs): signal masks, sigtimedwait, a raw fork between fork and exec

[features]
# The fakes of the batch engine (FakeLock, AllowAll, DenyRole). Off in the binary; on for this crate's own tests below.
test-fakes = []

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"                  # tests: raise RLIMIT_NOFILE and open a descriptor above the old fallback bound (runner_group.rs)

[dev-dependencies]
tempfile.workspace = true     # throwaway ledgers
gatetrain-core = { path = ".", features = ["test-fakes"] }   # the integration tests use the fakes
