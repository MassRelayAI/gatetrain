# gatetrain hosts - copy to hosts.toml (git-ignored) and edit. Names are yours; nothing here is a real machine.
# Plain TOML, read by gatetrain: no YAML library needed.
profile = "mixed"            # zero-cost | budget | speed | mixed

[budget]
monthly_cap_usd = 0          # 0 = never start a paid resource (zero-cost)
cloud_when_queue_wait_over_min = 30

# What each kind of run needs from ONE disk. A disk takes a run kind when it is present, allowed for it
# (use = [...]), has the free space, and (for chains, when chain_needs_fast) is fast.
[needs]
preflight_gb = 20
lane_gates_gb = 40
chain_gb = 120
chain_needs_fast = true

[[hosts]]
name = "builder-1"
kind = "server"             # local | server | cloud
roles = ["chain", "merge", "deploy"]
reach = "ssh builder-1"     # "local", or "ssh <target>"
cores = 40
max_parallel_steps = 8
max_pollers = 4             # concurrent ssh sessions allowed before doctor fails (L25)
cost_per_hour_usd = 0
tools = ["git", "node", "cargo"]            # must resolve and print a version (L29)
ports = [5500, 5501]                         # fixed test ports: outside the ephemeral range, unique (L21, L22)
reserved_port_ranges = ["55400-58399"]
gate_scripts = ["tools/gates/db-gate.mjs"]  # scanned for RANDOM port defaults whose range reaches the ephemeral range (L52)
container_prefix = "gate-"                   # leftover exited containers with this prefix are listed (L31)
watcher_max_age_min = 30                     # a tail -F older than this is a stray watcher (L24)
chain_pattern = "run-chain"                  # a process matching this means a chain is running (L26)
lock_file = "/run/gatetrain/chain.lock"      # older than lock_max_age_hours with no "released" line fails (L32)
lock_max_age_hours = 6
cache_server_check = "cachectl --show-stats" # exit 0 = the shared cache server is alive (L20)

  [[hosts.disks]]
  path = "/srv/build"
  min_free_gb = 100
  fast = true
  use = ["chain", "cache"]  # what this disk may hold: preflight | lane-gates | chain | cache | archive
  # measure = "age-only"    # on a slow disk: never run du under it (age and df only); default "du". See [tidy] size_timeout_s (L51)

  [[hosts.worktrees]]       # two worktrees must not share a build output folder (L17)
  name = "lane-a"
  build_dir = "/srv/build/lane-a/target"

  [[hosts.worktrees]]
  name = "lane-b"
  build_dir = "/srv/build/lane-b/target"

[[hosts]]
name = "workstation-1"
kind = "local"
roles = ["preflight", "lane-gates"]
reach = "local"
cores = 16
max_parallel_steps = 4
awake_hours = "08:00-02:00"
cost_per_hour_usd = 0

  [[hosts.disks]]
  path = "F:/build"
  min_free_gb = 80
  fast = true
  use = ["preflight", "lane-gates", "cache"]

  [[hosts.disks]]           # an external SSD that may be absent: when unmounted, what it enabled drops (a WARN)
  path = "E:/external-ssd"
  min_free_gb = 30
  fast = true
  removable = true
  use = ["preflight"]

[[hosts]]
name = "cloud-runner"
kind = "cloud"
roles = ["chain"]
reach = "api"               # started on demand, stopped after the run; doctor does not reach it
max_parallel_steps = 16
cost_per_hour_usd = 1.20
enabled = false             # only used in budget/speed profiles

# ---- multi-host chains (docs/multi-host.md): `gatetrain chain --hosts hosts.toml` spreads one run over the coordinator and
# every ENABLED host whose roles include "worker". A step counts green only from a host on the exact commit with the exact tools.
[multihost]
fingerprint = []                          # commands every worker must answer exactly as the coordinator does
local_tags = ["js"]                       # the coordinator's tags besides its platform tag (x86_64-linux, aarch64-macos, ...)
max_host_failures = 2                     # a worker that loses this many steps is removed for the run
max_step_attempts = 3                     # a step lost this many times is red (rc 125), never green

[multihost.tag_fingerprint]               # a tag counts on a worker only when these answer exactly as on the coordinator
"x86_64-linux" = ["rustc -V", "cargo -V", "docker version --format '{{.Server.Version}}'"]
js = ["node -v"]

[[hosts]]                   # a Linux worker, for example a distribution under WSL with its own sshd as a systemd service
name = "linux-worker"
kind = "local"
roles = ["worker"]
reach = "ssh builder@192.0.2.10"           # an address: names may not resolve between the machines
tags = ["x86_64-linux", "js"]
slots = 6                                  # keep it below what the person at this machine can spare
cores = 32
repo = "/home/builder/gatetrain/repo.git"  # a bare repository the coordinator pushes the commit into (no git-server credentials here)
workdir = "/home/builder/gatetrain/work"   # made as a worktree of repo on the first run
gatetrain_bin = "/home/builder/.cargo/bin/gatetrain"
prepare = "npm ci"                         # before the host's first step; a failure refuses the host for the run
prepare_key = ["package-lock.json"]        # an unchanged lockfile skips prepare on the next run
enabled = false                            # set true when the host is set up

[[hosts]]                   # a laptop that may only run platform-free JavaScript steps (requires = ["js"]); it may sleep
name = "laptop-js"
kind = "local"
roles = ["worker"]
reach = "ssh dev@192.0.2.20"
tags = ["js"]                              # never x86_64-linux: its platform tag is what its agent reports (aarch64-macos)
slots = 4
repo = "/Users/dev/gatetrain/repo.git"
workdir = "/Users/dev/gatetrain/work"
gatetrain_bin = "/Users/dev/.local/bin/gatetrain"
prepare = "npm ci"
prepare_key = ["package-lock.json"]
command_prefix = ["caffeinate", "-i"]      # stay awake while a step runs
enabled = false

[[models]]                  # agent spend, measured per lane and per review
name = "local-coder"
kind = "local"
cost_per_mtok_usd = 0

[[models]]
name = "cloud-implementer"
kind = "api"
cost_per_mtok_usd = 3

[[models]]
name = "cloud-reviewer"
kind = "api"
cost_per_mtok_usd = 15


[stack]                     # gatetrain generated: untracked files under these directories fail the check (L53)
generated_dirs = ["generated", "docs/_generated"]

[tidy]                      # gatetrain check / tidy: see README "Tidy and check"
main_checkout = "/srv/repo/main"
root_checkout = "/srv/repo/root"
worktree_prefix = "wt-"                   # folder-name prefix: /srv/wt/wt-lane-x is lane "lane-x" (a path here is refused)
worktree_min_idle_days = 2                # a worktree with a file changed in the last 2 days is kept (0 = off)
chain_checkout_max_age_days = 0            # a detached checkout NOT on main goes after this many idle days, tagged first (0 = only merged ones go)
keep_lanes = ["lane-x"]                   # a lane to keep; an entry that matches no worktree or target is reported by `check`
protect = ["/srv/captures"]                # never removed, never inside a removal, never reached through a link; paths or globs (default: none)
target_roots = ["/srv/build/targets"]     # one child folder per lane, named after the lane
targets = [{ path = "/srv/build/chain", budget_gb = 300 }]
trash_dir = "/srv/trash"
trash_days = 7
container_prefix = "gate-"
image_patterns = ["gate-img:*"]
unattended = ["targets", "containers", "trash"]
